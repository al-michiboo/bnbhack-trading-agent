[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mavis-trading-agent"
version = "0.1.0"
description = "AI trading agent for BNB Hack: AI Trading Agent Edition"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "michiboo", email = "michiboo@users.noreply.github.com"}]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "openai>=1.30",
    "anthropic>=0.30",
    "web3>=7.0",
    "eth-account>=0.13",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "tweepy>=4.14",
    "tenacity>=8.3",
    "rich>=13.7",
    "structlog>=24.1",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.5",
]

[project.scripts]
mavis = "agent.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
